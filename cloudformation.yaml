AWSTemplateFormatVersion: '2010-09-09'
Resources:

  LogAnalyzerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: log-analyzer-topic

  LogAnalyzerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LogAnalyzerFunction
      Runtime: python3.9
      Handler: lambda_function.lambda_handler
      Role: arn:aws:iam::YOUR_ACCOUNT_ID:role/YOUR_LAMBDA_ROLE
      Code:
        S3Bucket: YOUR_CODE_BUCKET
        S3Key: lambda.zip
      Timeout: 30